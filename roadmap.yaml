# Roadmap editoriale evergreen — Journal Marketing
#
# Alimente la skill /create-article-auto (publication automatique d'un article
# evergreen SEO bilingue FR + EN, sans intervention humaine).
#
# EMPLACEMENT
# -----------
# Ce fichier vit a la racine du repo (et PAS dans .claude/) : les fichiers de
# .claude/ sont traites comme sensibles par Claude Code et declenchent un popup
# a chaque edit, non contournable, qui bloquerait les runs cron de nuit.
#
# CADENCE : 5 articles par semaine, rotation continue des 7 rubriques
# -------------------------------------------------------------------
# Routine cloud du lundi au vendredi a 2h UTC (4h Paris en ete). L'agent publie
# UNE entree par run : la plus ancienne dont status == todo et
# scheduled_date <= today.
#
# Les 7 rubriques tournent dans un cycle continu qui **enjambe les semaines**.
# Le cycle ne se remet pas a zero le lundi : avec 5 jours ouvres et 7 rubriques,
# une semaine ne couvre jamais tout le site, et la semaine suivante reprend la
# rotation la ou elle s'etait arretee. Chaque rubrique revient donc tous les
# 7 articles, soit une fois toutes les une semaine et demie environ.
#
# Ordre du cycle :
#   SEO -> Contenu -> Publicite en ligne -> IA et GEO -> Data et mesure
#       -> Social et influence -> Outils et comparatifs -> SEO -> ...
#
# Le demarrage se fait un jeudi (2026-08-06), la premiere semaine ne porte donc
# que 2 articles, les suivantes 5.
# Deux articles consecutifs ne sont jamais de la meme rubrique.
#
# ANALYSE SERP : CRAZYSERP (et pas SerpAPI)
# -----------------------------------------
# L'etape d'analyse concurrentielle passe par l'API CrazySERP de datashake
# (cle CRAZYSERP_API_KEY). Elle renvoie dans un seul appel les resultats
# organiques, les People Also Ask, les recherches associees, l'AI Overview et
# le volume de recherche. Repli automatique sur WebSearch si l'egress du
# sandbox cloud bloque crazyserp.com. Detail : skill create-article-auto.
#
# SOURCE DES MOTS-CLES
# --------------------
# Decouverte Haloscan (/keywords/match + /keywords/related) sur 54 seeds, le
# 2026-08-05 : 1 876 mots-cles remontes, tries a la main pour retirer le bruit
# d'homonymie (les "seo" d'acteurs coreens, "ugc" les cinemas, "cpc" le code de
# procedure civile, les taux de conversion de devises).
#
# NOTE : la GSC d'universdelatech.fr a bien ete interrogee (5 000 requetes,
# 12 mois, marche FR) mais elle n'est PAS reutilisable ici. Ses meilleurs
# mots-cles sont du tech grand public utilitaire ("chat gratuit comme coco"
# 988 clics, "supprimer compte micromania", "iptv orange", "generateur de
# pseudo"). Sur 5 000 requetes, aucune ne porte un sujet de marketing digital
# editorial. Ce qui a ete repris d'UDLT, c'est le PATTERN d'intention qui
# performe chez eux : definitionnel ("c'est quoi"), comparatif/alternative,
# tutoriel outil et liste "meilleur...".
#
# COMMENT AJOUTER UNE ENTREE (humain)
# -----------------------------------
# 1. Copier un bloc, le placer a la fin de la liste `articles`
# 2. Renseigner kw, category (doit matcher une categorie de hugo.toml) et
#    scheduled_date (un jour ouvre), en poursuivant le cycle des rubriques la
#    ou la derniere entree l'a laisse
# 3. volume et kd sont informatifs, ignores par l'agent
# 4. Laisser les autres champs a null
# 5. Commit + push : le prochain run eligible prend l'entree
#
# DEBLOQUER UNE ENTREE FAILED
# ---------------------------
# Lire `error:`, corriger, repasser `status: todo`, vider `error: null`,
# commit + push. Une entree failed n'est jamais retentee automatiquement.

