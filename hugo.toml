baseURL = "https://journal-marketing.fr/"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
title = "Journal Marketing"
enableRobotsTXT = true
enableEmoji = true
capitalizeListTitles = false
removePathAccents = true
summaryLength = 24

[pagination]
  pagerSize = 9

[params]
  brand = "journal marketing"

[languages]
  [languages.fr]
    locale = "fr-FR"
    label = "Français"
    weight = 1
    title = "Journal Marketing"
    contentDir = "content/fr"
    [languages.fr.params]
      brandSuffix = "média marketing digital"
      tagline = "Le journal du marketing digital"
      description = "Analyses, guides et comparatifs sur le SEO, l'IA, le contenu, le social, la publicité et la data. Le média indépendant du marketing digital."
      baseline = "SEO, IA, contenu, social, ads, data : tous les leviers de votre visibilité."

  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 2
    title = "Journal Marketing"
    contentDir = "content/en"
    [languages.en.params]
      brandSuffix = "digital marketing media"
      tagline = "The digital marketing journal"
      description = "Analysis, guides and comparisons on SEO, AI, content, social, advertising and data. The independent digital marketing media."
      baseline = "SEO, AI, content, social, ads, data: every lever of your visibility."

[taxonomies]
  categorie = "categories"
  tag = "tags"
  auteur = "auteurs"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    noClasses = false

[related]
  includeNewer = true
  threshold = 40
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 60

# ---- Menus FR ----
